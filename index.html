<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h2>Cadastro de Produto</h2>
        <form id="formProduto">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" required>
    
            <label for="preco">Preço (R$):</label>
            <input type="number" id="preco" min="0" step="0.01">

            <label for="categoria">Categoria do Produto:</label>
            <select id="categoria" required>
                <option value=""Selecione:></option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Periféricos">Periféricos</option>
            </select>

            <button type="submit">Salvar Produto</button>
            
        </form>

        <input type="text" id="busca" placeholder="Buscar produto...">
        <button type="button" id="btnTodos">Todos</button>
        <button type="button" id="btnEletronicos">Eletrônicos</button>
        <button type="button" id="btnPerifericos">Periféricos</button>
        
        <section id="lista-produtos"></section>

    </main>

    <script src="script.js"></script>
</body>
</html>
